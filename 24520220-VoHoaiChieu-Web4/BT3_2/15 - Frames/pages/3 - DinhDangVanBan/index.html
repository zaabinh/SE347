<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Định dạng văn bản</title>
</head>
<body>
    <h1>
        Định dạng văn bản
    </h1>
    <section>
        <p id="hoahoc">
            <span class="hh1" > Hóa học:</span> 
            <span class ="hh2"> Nước: </span> 
            <span class="hh3">H<sub>2</sub>O</span> 
            <span class ="hh4">; Axit Sunfuric:</span>
            <span class ="hh5"> H<sub>2</sub>SO<sub>4</sub></span>
        </p>
        <p id="toanhoc">
            <span class="th1" > Toán học:</span> 
            <span class ="th2"> Phương trình bậc 2: </span> 
            <span class="th3"> ax<sup>2</sup> + bx + c = 0</span> 
    
        </p>
        <p id="tinhoc">
            <span class="tinh1" > Tin học:</span> 
            <span class ="tinh2">  Vòng lặp for: </span> 
        </p>
        <p id="vongfor">
            int tong = 0;<br>
             for(int i = 1; i <= 10; i++)<br>
            	<span class="indent"> tong+=i;</span><br>
             printf("Tong cac so tu 1 => 10 la: %d\n",tong);

        </p>
        
    </section>
</body>
</html>
