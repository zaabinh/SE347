<!DOCTYPE html>
<html>
    <head>
        <title>Định dạng văn bản</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Định dạng văn bản</h1>
        <section>
            <p>
                <strong><u>Hóa học:</u></strong> 
                <em>Nước:</em> <span class="red">H<sub>2</sub>O</span> ; 
                <em>Axit Sunfuric</em> <span class="red">H<sub>2</sub>SO<sub>4</sub></span>
            </p>
            <p>
                <strong><u>Toán học:</u></strong><em> 
                Phương trình bậc 2: </em> 
                <span class="red">ax<sup>2</sup> + bx + c = 0</span>
            </p>
            <p>
                <strong><u>Tin học:</u></strong> 
                <em>Vòng lặp for</em></p>
            <div class="codebox">
                <code>
                    int tong = 0; <br>
                    for(int i = 1; i <= 10; i++) <br>
                        &emsp;tong += i; <br>
                    printf("Tong cac so tu 1 => 10 la: %d\n",tong);
                </code>
            </div>
        </section>
    </body>
</html>
