<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCAAL Coffee</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <a href="#home" aria-label="SCAAL Coffee home">
        <img src="images/logo_scaal.gif"
             width="700" height="60"
             alt="SCAAL — brave new world coffee">
      </a>
    </header>

    <div class="layout">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#story">Our story</a>
        <a href="#products">Products</a>
        <a href="#thisweek">This week</a>
      </nav>

      <main id="main-content" class="content-panel">
        <div class="content-grid">
          <article id="page-content"
                   aria-labelledby="page-title"></article>

          <div class="coffee-art">
            <img src="images/coffee-cup.jpg"
                 width="185" height="167"
                 alt="A steaming cup of coffee">
            <img src="images/coffee-online.gif"
                 width="200" height="78"
                 alt="Coffee online">
          </div>
        </div>
      </main>

      <div class="brand-decoration" aria-hidden="true">
        <img class="globe-left"
             src="images/logo_globe_a.gif" alt="">
        <img class="globe-right"
             src="images/logo_globe_b.gif" alt="">
      </div>
    </div>
  </div>

  <!-- Page templates share the navigation, imagery, and responsive layout. -->
  <template id="page-home">
    <div class="welcome-intro">
      <h1 id="page-title" tabindex="-1">Welcome</h1>
      <p>to the Scaal Coffee Web site, home of the finest
         coffee gifts in the world.</p>
    </div>
    <p>Take a moment to view our many <a href="#products">products</a>. We offer fine roasted products as well as items to wear and items for the office.</p>
    <p>Scaal has been serving fine coffee connoisseurs like you for over 50 years. We follow a roasting process that produces the finest coffees in the world.</p>
    <p>Check with us often to see our <a href="#thisweek">special promotions</a> of the week.</p>
  </template>

  <template id="page-story">
    <h1 id="page-title" tabindex="-1">Our Story</h1>
    <p>What is the one philosophy that drives <strong class="brand-name">SCAAL</strong>? We believe that no matter where you go, you should always be able to enjoy the simple pleasure of a good cup of coffee in a comfortable environment. At home, reading the morning paper. At your local <strong class="brand-name">SCAAL</strong>, conversing with a confidant. Or perhaps in some foreign land, <strong class="brand-name">SCAAL</strong> will be greeting you like an old friend. After all, coffee is a ritual that transcends all cultural boundaries. It makes us feel alert, energetic and alive.</p>
  </template>

  <template id="page-products">
    <h1 id="page-title" tabindex="-1">
      What makes SCAAL the best coffee?
    </h1>
    <p>Anders has passed down the knowledge he learned as an apprentice in the coffee fields to every buyer, roaster, and franchise owner. <strong class="brand-name">SCAAL</strong>'s standards for coffee are never compromised. We only select SHB &ndash; strictly hard bean or strictly high grown &ndash; coffee beans. To ensure their flavorful oils are preserved, extraordinary steps are taken to protect the coffee bean from heat, light, air and moisture.</p>
    <p>All these efforts are made so that we may offer you a perfect cup of coffee.</p>
  </template>

  <template id="page-thisweek">
    <h1 id="page-title" tabindex="-1">This week</h1>
    <p>There are so many places you could go to buy coffee. We've gone to extraordinary efforts to ensure that <strong class="brand-name">SCAAL</strong> is your best choice. The quality begins at harvest.</p>
    <p><strong class="brand-name">SCAAL</strong> relies on selective picking, a labor-intensive process that involves making several passes among the trees for those cherries that are perfectly ripe. Then we select top grade SHB, which stands for strictly hard bean or strictly high grown.</p>
    <p>Beans that are grown at a minimum altitude of 4,000 feet above sea level for optimum flavor. Within hours of shipping our coffee to you, the beans are roasted on-site in small batches by a Certified Roastmaster and vacuum-packed to retain its fresh taste and rich aroma.</p>
  </template>
</body>
</html>
