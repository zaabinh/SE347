<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Phiếu Đăng Ký</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Phiếu đăng ký</h1>
        <div class="form-container">
            <form action="index.html" method="post" id="register-form">
                <label for="fullname">Họ tên</label>
                <div class="field"><input type="text" name="fullname" id="fullname" required></div>
                <label for="address">Địa chỉ</label>
                <div class="field"><textarea name="address" id="address" required></textarea></div>
                <label for="email">Email</label>
                <div class="field"><input type="email" name="email" id="email" required></div>
                <label for="tel">Điện thoại</label>
                <div class="field"><input type="tel" name="tel" id="tel" required pattern="[0-9]{10}" title="Số điện thoại gồm 10 chữ số"></div>
                <label id="gender-label">Giới tính</label>
                <div class="field" data-label="Giới tính">
                    <div class="gender-input" role="radiogroup" aria-labelledby="gender-label">
                        <input type="radio" name="gender" id="gender-male" value="Nam" required>
                        <label for="gender-male">Nam</label>
                        <input type="radio" name="gender" id="gender-female" value="Nữ">
                        <label for="gender-female">Nữ</label>
                    </div>
                </div>
                <label for="occupation">Nghề nghiệp</label>
                <div class="field">
                    <select name="occupation" id="occupation">
                        <option value="doctor">Bác sĩ</option>
                        <option value="engineer">Kỹ sư</option>
                        <option value="teacher">Giáo viên</option>
                        <option value="student">Sinh viên</option>
                        <option value="other" id="other-option">Khác</option>
                    </select>
                    </div>
                <label for="product">Chọn sản phẩm</label>
                <div class="field">
                    <select name="product" id="product" size="4" required>
                        <option value="1">Kem đánh răng</option>
                        <option value="2">Dầu gội</option>
                        <option value="3">Sữa tắm</option>
                        <option value="4">Bột giặt</option>
                    </select>
                    </div>
                <label for="prediction">Dự đoán số người tham gia</label>
                <div class="field"><input type="number" name="prediction" id="prediction" min="0" required></div>
                <button type="submit" id="submit">Đăng ký</button>
                <button type="reset" id="reset">Làm lại</button>
            </form>
            <p id="message" role="status"></p>
        </div>
    </body>
</html>
